name: Vérification du code

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Configurer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Vérifier le site
        run: npm test
